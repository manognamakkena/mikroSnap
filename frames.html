<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,height=device-height, intial-scale=1.0">

        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
        <title>choose a frame!</title>
    </head>

    <body class="framesBody">
        <div class="carousel">
            <div class="frame">
                <div class="tray"></div>
                <img src="assets/black.png" alt="plain black frame">
            </div>
            <div class="frame">
                <div class="tray"></div>
                <img src="assets/blackEdited.png" alt="black frame with emojis">
            </div>
            <div class="frame">
                <div class="tray"></div>
                <img src="assets/maroon.png" alt="plain maroon frame">
            </div>
            <div class="frame">
                <div class="tray"></div>
                <img src="assets/maroonFrame_edited.png" alt="maroon frame edited with emoji">
            </div>
            <div class="frame">
                <div class="tray"></div>
                <img src="assets/white.png" alt="plain white frame">
            </div>
        </div>
    </body>
    
</html>
