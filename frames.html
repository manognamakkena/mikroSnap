<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,height=device-height, intial-scale=1.0">

        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <title>choose a frame!</title>
    </head>

    <body class="framesBody">
        <div class="carousel">
            <div class="frame">
                <img src="assets/white.png" alt="plain white frame" id="white">
            </div>
            <div class="frame">
                <img src="assets/black.png" alt="plain black frame" id="black">
            </div>
            <div class="frame">
                <img src="assets/blackEdited.png" alt="black frame with emojis" id= "blackEdited">
            </div>
            <div class="frame">
                <img src="assets/maroon.png" alt="plain maroon frame" id="maroon">
            </div>
            <div class="frame">
                <img src="assets/maroonFrame_edited.png" alt="maroon frame edited with emoji" id="maroonEdited">
            </div>
        </div>
    </body>
    
</html>
