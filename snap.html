<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,height=device-height, initial-scale=1.0">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+Great+Primer+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title> snap! </title>
</head>
<body class="snapBody">
    <div class = 'wrapper'>
        <div class="container">
            <video id="video" width="300" height="500" autoplay playsinline></video>
            <div id="timer" class = "timer"></div>
            <button id="snap" class="shutter">snap!</button>
        </div>

        <div class="camera-snapshot" id="camera-snapshot"> </div>
    </div>
    <button id="download" class="download">download!</button>
    <div class='instructions'>
        <p>
        click the snap button to start
        <br><br>
        cannot download until you take a photo
        <br><br>
        reload to start over
        </p>
    </div>
</body>
</html>
